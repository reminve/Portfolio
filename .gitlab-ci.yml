image: node:20-alpine

stages:
  - build
  - deploy
  - 📦push

build_angular:
  stage: build
  script:
    - rm -f package-lock.json
    - npm i
    - npm run build -- --base-href ./
  artifacts:
    paths:
      - dist/angular-portfolio/browser/
    expire_in: 1 hour

pages:
  stage: deploy
  dependencies:
    - build_angular
  script:
    - rm -rf public
    - mv dist/angular-portfolio/browser public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'build/.docker-build.yml'

push-portfolio-image:
  extends: .build-and-push-docker-image
  stage: 📦push
  variables:
    DOCKERFILE_RELATIVE_PATH: "Dockerfile"
    DOCKERFILE_CONTEXT_PATH: "."
    DESTINATION_REGISTRY_IMAGE_NAME: "$CI_REGISTRY_IMAGE/portfolio"
    # Version en fonction du commit
    DESTINATION_REGISTRY_IMAGE_VERSION: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"