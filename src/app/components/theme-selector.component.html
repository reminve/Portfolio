<section class="theme-selector" (click)="$event.stopPropagation()" (keydown.escape)="isOpen.set(false)" aria-label="Sélecteur de thème">
  <button class="theme-toggle" (click)="toggleDropdown()" aria-label="Paramètres du thème" aria-haspopup="true" [attr.aria-expanded]="isOpen()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
    </svg>
  </button>

  @if (isOpen()) {
    <div class="theme-dropdown">
      <!-- Dark Mode Section -->
      <div class="theme-section">
        <h4>Mode d'affichage</h4>
        <div class="mode-buttons">
          <button
            [class.active]="themeService.currentTheme().mode === 'auto'"
            (click)="setMode('auto')"
            title="Suivre les préférences système">
            Auto
          </button>
          <button
            [class.active]="themeService.currentTheme().mode === 'light'"
            (click)="setMode('light')"
            title="Mode clair">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4m12.8-12.8 1.4-1.4"/>
            </svg>
          </button>
          <button
            [class.active]="themeService.currentTheme().mode === 'dark'"
            (click)="setMode('dark')"
            title="Mode sombre">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Accent Color Section -->
      <div class="theme-section">
        <h4>Couleur d'accent</h4>
        <div class="accent-palette">
          @for (accent of accents; track $index) {
            <button
              class="accent-btn"
              [class.active]="themeService.currentAccent() === accent.key"
              [style.backgroundColor]="accent.preview"
              [attr.aria-label]="accent.name"
              [attr.title]="accent.name"
              (click)="setAccent(accent.key)">
              @if (themeService.currentAccent() === accent.key) {
                <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              }
            </button>
          }
        </div>
      </div>
    </div>
  }
</section>
