<div class="app-container">
  <header>
    <div class="header-content">
      <div class="logo">
        <h1>Mon Portfolio</h1>
      </div>
      <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Ouvrir le menu">
        @if (!isMenuOpen) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        }
      </button>
      <nav [class.open]="isMenuOpen" (click)="closeMenu()">
        <a routerLink="/" routerLinkActive="router-link-active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
        <a routerLink="/about" routerLinkActive="router-link-active">À propos</a>
        <a routerLink="/skills" routerLinkActive="router-link-active">Compétences</a>
        <a routerLink="/projects" routerLinkActive="router-link-active">Projets</a>
        <a routerLink="/experience" routerLinkActive="router-link-active">Expériences</a>
        <a routerLink="/contact" routerLinkActive="router-link-active">Contact</a>
      </nav>
      <app-theme-selector></app-theme-selector>
    </div>
  </header>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <footer>
    <div class="social-links">
      <a href="https://github.com/reminve" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://linkedin.com/in/reminve" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-linkedin"></i>
      </a>
    </div>
    <p>&copy; {{ currentYear }} - Mon Portfolio</p>
  </footer>
</div>
